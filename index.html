<!DOCTYPE html>
<html>
<head>
    <title>hawke297 Custom Player</title>
    <script type="text/javascript" src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <style>
        body { background-color: #000000; margin: 0; overflow: hidden; font-family: Arial, sans-serif; color: white; }
        #cast-video { width: 100vw; height: 100vh; object-fit: contain; position: absolute; top: 0; left: 0; z-index: 1; }
        h1 { position: absolute; top: 20px; left: 20px; z-index: 9999; text-shadow: 2px 2px 4px #000000; font-size: 18px; color: gray; }
        
        #custom-overlay {
            position: absolute; top: 30px; right: 30px; 
            background-color: rgba(30, 30, 40, 0.85); border: 1px solid rgba(255, 255, 255, 0.1);
            color: #eeeeee; padding: 15px 25px; font-size: 22px; z-index: 9999; display: none; 
            border-radius: 12px; box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.6);
        }

        #clock-ui {
            position: absolute; top: 30px; right: 30px; 
            background-color: rgba(30, 30, 40, 0.85); border: 1px solid rgba(255, 255, 255, 0.1);
            color: #eeeeee; padding: 10px 20px; font-size: 28px; font-weight: bold; font-family: monospace;
            z-index: 9999; display: none; border-radius: 12px; box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.6);
            text-shadow: 1px 1px 2px black;
        }

        #progress-ui {
            position: absolute; bottom: 40px; left: 5%; right: 5%;
            background-color: rgba(30, 30, 40, 0.85); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; padding: 15px 20px; display: none; z-index: 9999;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.6);
        }
        #progress-info-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        #status-icon { font-size: 24px; color: white; text-shadow: 1px 1px 2px black; }
        #progress-text { color: white; font-size: 20px; font-weight: bold; font-family: monospace; text-shadow: 1px 1px 2px black; }
        #progress-bar-bg { width: 100%; height: 8px; background-color: #555; border-radius: 4px; overflow: hidden; }
        #progress-bar-fill { width: 0%; height: 100%; background-color: #e50914; transition: width 0.5s linear; }
    </style>
</head>
<body>
    <h1 id="version-display">hawke297 player | v1.16</h1>
    <div id="custom-overlay">Warte auf Signal...</div>
    <div id="clock-ui">00:00</div>
    <div id="progress-ui">
        <div id="progress-info-container">
            <div id="status-icon">▶</div>
            <div id="progress-text">0:00 / 0:00</div>
        </div>
        <div id="progress-bar-bg"><div id="progress-bar-fill"></div></div>
    </div>
    <video id="cast-video"></video>

    <script>
        const PLAYER_VERSION = "1.16";
        document.getElementById('version-display').innerText = "hawke297 player | v" + PLAYER_VERSION;

        const context = cast.framework.CastReceiverContext.getInstance();
        const playerManager = context.getPlayerManager();
        const CUSTOM_CHANNEL = 'urn:x-cast:op.viewer';

        playerManager.setMediaElement(document.getElementById('cast-video'));
        const options = new cast.framework.CastReceiverOptions();
        options.customNamespaces = {};
        options.customNamespaces[CUSTOM_CHANNEL] = cast.framework.system.MessageType.JSON;
        options.disableIdleTimeout = true; 

        let timeUpdateInterval = null;
        let activeSenderId = null; 
        let lastPlayerState = null;
        let uiTimeout = null; 

        // --- DER ZURÜCK-TASTEN HACK ---
        // Wir schieben eine "leere Seite" in den Verlauf, damit der erste "Zurück"-Klick uns nicht beendet.
        history.pushState({ page: "player" }, "Player", "");
        
        window.addEventListener('popstate', function(event) {
            // Android TV versucht "Zurück" zu gehen. Wir fangen es ab!
            if (activeSenderId) {
                context.sendCustomMessage(CUSTOM_CHANNEL, activeSenderId, {
                    type: "KEY_PRESS", 
                    key: "BrowserBack", 
                    code: "Intercepted"
                });
            }
            // SOFORT wieder einen Eintrag in den Verlauf schieben, damit wir auch beim nächsten Mal geschützt sind.
            history.pushState({ page: "player" }, "Player", "");
        });
        // --- ENDE ZURÜCK-HACK ---

        function formatTime(seconds) {
            if (!seconds || isNaN(seconds)) return "0:00";
            let m = Math.floor(seconds / 60);
            let s = Math.floor(seconds % 60);
            return m + ":" + (s < 10 ? "0" : "") + s;
        }

        function updateClock() {
            let now = new Date();
            let h = now.getHours();
            let m = now.getMinutes();
            document.getElementById('clock-ui').innerText = (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m;
        }

        function showCustomUI(keepOpen) {
            document.getElementById('progress-ui').style.display = 'block';
            document.getElementById('clock-ui').style.display = 'block';
            updateClock();
            if (uiTimeout) clearTimeout(uiTimeout);
            if (!keepOpen) {
                uiTimeout = setTimeout(() => {
                    document.getElementById('progress-ui').style.display = 'none';
                    document.getElementById('clock-ui').style.display = 'none';
                }, 4000);
            }
        }

        context.addCustomMessageListener(CUSTOM_CHANNEL, function(customEvent) {
            const data = customEvent.data;
            const overlay = document.getElementById('custom-overlay');
            activeSenderId = customEvent.senderId; 
            
            if (data.type === "GET_VERSION") {
                context.sendCustomMessage(CUSTOM_CHANNEL, activeSenderId, { type: "VERSION", version: PLAYER_VERSION });
            }
            else if (data.type === "SET_TEXT") {
                overlay.innerHTML = data.text;
            } 
            else if (data.type === "TOGGLE_OVERLAY") {
                overlay.style.display = data.visible ? "block" : "none";
            }
            else if (data.type === "SHOW_PROGRESS") {
                showCustomUI(false); 
            }
            else if (data.type === "LOAD_VIDEO") {
                document.getElementById('version-display').style.display = 'none';
                let request = new cast.framework.messages.LoadRequestData();
                let mediaInfo = new cast.framework.messages.MediaInformation();
                mediaInfo.contentId = data.url;
                mediaInfo.contentType = data.url.includes('.m3u8') ? 'application/x-mpegurl' : 'video/mp4';
                let metadata = new cast.framework.messages.GenericMediaMetadata();
                metadata.title = data.title || "Custom Stream";
                metadata.subtitle = data.subtitle || "";
                mediaInfo.metadata = metadata;
                request.media = mediaInfo;
                request.autoplay = true;
                playerManager.load(request);

                if (timeUpdateInterval) clearInterval(timeUpdateInterval);
                timeUpdateInterval = setInterval(() => {
                    try {
                        let currentState = playerManager.getPlayerState();
                        if (currentState !== lastPlayerState) {
                            context.sendCustomMessage(CUSTOM_CHANNEL, activeSenderId, {
                                type: "REMOTE_ACTION", action: "STATE_CHANGED", value: currentState
                            });
                            if (currentState === 'PAUSED') {
                                document.getElementById('status-icon').innerText = "⏸";
                                showCustomUI(true); 
                            } else if (currentState === 'BUFFERING') {
                                document.getElementById('status-icon').innerText = "⌛"; 
                                showCustomUI(true);
                            } else if (currentState === 'PLAYING') {
                                document.getElementById('status-icon').innerText = "▶";
                                showCustomUI(false); 
                            }
                            lastPlayerState = currentState;
                        }

                        let cur = playerManager.getCurrentTimeSec();
                        let dur = playerManager.getDurationSec();
                        if (document.getElementById('progress-ui').style.display === 'block') {
                            document.getElementById('progress-text').innerText = formatTime(cur) + " / " + formatTime(dur);
                            let percent = (dur > 0) ? (cur / dur * 100) : 0;
                            document.getElementById('progress-bar-fill').style.width = percent + '%';
                            updateClock(); 
                        }
                        context.sendCustomMessage(CUSTOM_CHANNEL, activeSenderId, {
                            type: "TIME_UPDATE", currentTime: cur, duration: dur
                        });
                    } catch (e) {}
                }, 1000); 
            }
        });

        window.addEventListener('keydown', function(event) {
            if (activeSenderId) {
                try {
                    context.sendCustomMessage(CUSTOM_CHANNEL, activeSenderId, {
                        type: "KEY_PRESS", key: event.key, code: event.code
                    });
                } catch (e) {}
            }
        });

        context.start(options);
    </script>
</body>
</html>
