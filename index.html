<!DOCTYPE html>
<html>
<head>
    <title>hawke297 Custom Player</title>
    <script type="text/javascript" src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <style>
        :root {
            --clock-display: block; --clock-color: #eeeeee; --progress-color: #e50914;
            --ui-bg-color: transparent; --ui-border: none; 
            --ui-text-shadow: 2px 2px 4px black, 0px 0px 10px black, 0px 0px 20px black; 
            --ui-box-shadow: none; --ui-bottom-offset: 0px; --ui-side-margin: 0px; 
            --ui-border-radius: 0px; --title-display: block;
        }

        body { background-color: #000000; margin: 0; overflow: hidden; font-family: Arial, sans-serif; color: white; }
        #bg-image { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 0; opacity: 0; transition: opacity 1s ease-in-out; }
        #cast-video { width: 100vw; height: 100vh; object-fit: contain; position: absolute; top: 0; left: 0; z-index: 1; }
        h1 { position: absolute; top: 20px; left: 20px; z-index: 9999; text-shadow: 2px 2px 4px #000000; font-size: 18px; color: gray; }
        
        #notification-layer { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999; pointer-events: none; }
        .notification-box {
            position: absolute; padding: 20px 30px; font-size: 24px; border-radius: 12px; 
            box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.8);
            opacity: 0; transition: opacity 0.3s ease-in-out; text-align: center;
        }
        
        #clock-ui {
            position: absolute; top: 30px; left: 30px; 
            background-color: var(--ui-bg-color); border: var(--ui-border); box-shadow: var(--ui-box-shadow);
            color: var(--clock-color); padding: 10px 20px; font-size: 28px; font-weight: bold; font-family: monospace;
            z-index: 9998; border-radius: 12px; text-shadow: var(--ui-text-shadow); opacity: 0; transition: opacity 0.5s ease-in-out;
            display: var(--clock-display);
        }

        #title-ui {
            position: absolute; top: 30px; left: 50%; transform: translateX(-50%); 
            background-color: var(--ui-bg-color); border: var(--ui-border); box-shadow: var(--ui-box-shadow);
            color: white; padding: 10px 30px; font-size: 24px; font-weight: bold; 
            z-index: 9998; border-radius: 12px; text-shadow: var(--ui-text-shadow); opacity: 0; transition: opacity 0.5s ease-in-out;
            display: var(--title-display);
        }

        #progress-ui {
            position: absolute; bottom: var(--ui-bottom-offset); left: var(--ui-side-margin); right: var(--ui-side-margin);
            border-radius: var(--ui-border-radius); background-color: var(--ui-bg-color); border: var(--ui-border); box-shadow: var(--ui-box-shadow);
            padding: 15px 20px; z-index: 9998; opacity: 0; transition: all 0.3s ease-in-out;
        }
        .ui-visible { opacity: 1 !important; }
        
        #progress-info-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        #status-icon { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; filter: drop-shadow(var(--ui-text-shadow)); }
        #progress-text { color: white; font-size: 20px; font-weight: bold; font-family: monospace; text-shadow: var(--ui-text-shadow); }
        #progress-bar-bg { width: 100%; height: 8px; background-color: rgba(0,0,0,0.5); border: 1px solid rgba(0,0,0,0.8); border-radius: 4px; overflow: visible; position: relative; }
        #markers-container { position: absolute; bottom: 100%; left: 0; width: 100%; height: 2px; z-index: 3; pointer-events: none; margin-bottom: 2px; }
        .skip-marker { position: absolute; height: 100%; bottom: 0; opacity: 1.0; border-radius: 1px; }
        #progress-bar-fill { width: 0%; height: 100%; background-color: var(--progress-color); transition: width 0.5s linear; position: absolute; top: 0; left: 0; z-index: 2; border-radius: 4px; }

        #smart-tv-ui {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 50; display: none; background-color: #0f0f15;
            padding: 60px; box-sizing: border-box;
            grid-template-columns: repeat(3, 1fr); gap: 30px;
            transition: transform 0.2s ease-out; overflow: visible;
        }
        
        .grid-tile {
            background-color: #1e1e2e; border-radius: 12px; overflow: hidden;
            border: 6px solid transparent; transition: border-color 0.1s, transform 0.1s;
            position: relative; height: 280px; display: block;
        }
        
        .grid-tile.focused {
            border-color: #d0383e; transform: scale(1.05);
            box-shadow: 0px 10px 30px rgba(208, 56, 62, 0.8); z-index: 10;
        }
        
        .grid-tile .media-layer { 
            width: 100%; height: 100%; object-fit: cover; 
            position: absolute; top: 0; left: 0; z-index: 1; 
        }

        /* FIX: Keine weiche Blende (opacity) mehr! Harter Schnitt schont die TV-GPU. */
        .grid-tile .video-layer { 
            width: 100%; height: 100%; object-fit: cover; 
            position: absolute; top: 0; left: 0; z-index: 2; 
            visibility: hidden; 
        }
        
        .grid-tile .title-container { 
            position: absolute; bottom: 0; left: 0; width: 100%; 
            background: rgba(0,0,0,0.8); padding: 15px 0; box-sizing: border-box; z-index: 3; margin: 0; 
            overflow: hidden; text-align: center;
        }

        .grid-tile .title-container span {
            display: inline-block; color: white; font-size: 22px; font-weight: bold; 
            font-family: sans-serif; text-shadow: 1px 1px 3px black; white-space: nowrap; 
            padding: 0 15px; 
        }

        @keyframes marquee { 
            0% { transform: translateX(0); } 
            100% { transform: translateX(-100%); } 
        }

        .grid-tile.focused.is-playing .title-container span {
            animation: marquee 8s linear infinite;
        }
    </style>
</head>
<body>
    <div id="smart-tv-ui"></div>
    <h1 id="version-display">hawke297 player | v2.0.019</h1>
    <img id="bg-image" />
    <div id="notification-layer"></div>
    <div id="clock-ui">00:00</div>
    <div id="title-ui"></div>
    <div id="progress-ui">
        <div id="progress-info-container">
            <div id="status-icon"></div>
            <div id="progress-text">0:00 / 0:00</div>
        </div>
        <div id="progress-bar-bg">
            <div id="markers-container"></div>
            <div id="progress-bar-fill"></div>
        </div>
    </div>
    <video id="cast-video"></video>

    <script>
        const PLAYER_VERSION = "2.0.019";
        document.getElementById('version-display').innerText = "hawke297 player | v" + PLAYER_VERSION;

        const SVG_PLAY = '<svg viewBox="0 0 24 24" width="28" height="28" fill="white"><path d="M8 5v14l11-7z"/></svg>';
        const SVG_PAUSE = '<svg viewBox="0 0 24 24" width="28" height="28" fill="white"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
        const SVG_BUFFER = '<svg viewBox="0 0 24 24" width="28" height="28" fill="white"><path d="M12 2A10 10 0 1 0 22 12A10 10 0 0 0 12 2Zm0 18A8 8 0 1 1 20 12A8 8 0 0 1 12 20Z" opacity="0.5"/><path d="M12 4A8 8 0 0 1 20 12h2A10 10 0 0 0 12 2Z"><animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="1s" repeatCount="indefinite"/></path></svg>';
        const SVG_ERROR = '<svg viewBox="0 0 24 24" width="28" height="28" fill="#ff3333"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>';

        document.getElementById('status-icon').innerHTML = SVG_PLAY;

        const context = cast.framework.CastReceiverContext.getInstance();
        const playerManager = context.getPlayerManager();
        const CUSTOM_CHANNEL = 'urn:x-cast:op.viewer';

        playerManager.setMediaElement(document.getElementById('cast-video'));
        const options = new cast.framework.CastReceiverOptions();
        options.customNamespaces = {};
        options.customNamespaces[CUSTOM_CHANNEL] = cast.framework.system.MessageType.JSON;
        options.disableIdleTimeout = true; 

        let timeUpdateInterval = null;
        let activeSenderId = null; 
        let lastPlayerState = null;
        let uiTimeout = null; 
        let previewTimer = null; 
        
        const bgImageElement = document.getElementById('bg-image');

        function sendTelemetry(msg) {
            if (activeSenderId) {
                try { context.sendCustomMessage(CUSTOM_CHANNEL, activeSenderId, { type: "TELEMETRY", msg: msg }); } catch(e) {}
            }
        }

        window.onerror = function(message, source, lineno, colno, error) {
            sendTelemetry("TV JS-Crash: " + message + " (Zeile " + lineno + ")");
            return true;
        };

        playerManager.addEventListener(cast.framework.events.EventType.ERROR, (event) => {
            sendTelemetry("Haupt-Player Fehler: " + JSON.stringify(event));
        });
        
        function showNotification(text, config) {
            const layer = document.getElementById('notification-layer');
            const notif = document.createElement('div');
            notif.className = 'notification-box';
            notif.innerHTML = text;
            notif.style.backgroundColor = config.bg_color || "rgba(30, 30, 40, 0.95)";
            notif.style.color = config.text_color || "#ffffff";
            if (config.position === "center") { notif.style.top = "50%"; notif.style.left = "50%"; notif.style.transform = "translate(-50%, -50%)"; }
            layer.appendChild(notif);
            setTimeout(() => notif.style.opacity = "1", 50);
            setTimeout(() => { notif.style.opacity = "0"; setTimeout(() => notif.remove(), 300); }, config.duration || 4000);
        }

        function formatTime(seconds) {
            if (!seconds || isNaN(seconds)) return "0:00";
            let m = Math.floor(seconds / 60); let s = Math.floor(seconds % 60);
            return m + ":" + (s < 10 ? "0" : "") + s;
        }

        function updateClock() {
            let now = new Date(); let h = now.getHours(); let m = now.getMinutes();
            document.getElementById('clock-ui').innerText = (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m;
        }

        function showCustomUI(keepOpen) {
            document.getElementById('progress-ui').classList.add('ui-visible');
            document.getElementById('clock-ui').classList.add('ui-visible');
            document.getElementById('title-ui').classList.add('ui-visible');
            updateClock();
            if (uiTimeout) clearTimeout(uiTimeout);
            if (!keepOpen) {
                uiTimeout = setTimeout(() => {
                    document.getElementById('progress-ui').classList.remove('ui-visible');
                    document.getElementById('clock-ui').classList.remove('ui-visible');
                    document.getElementById('title-ui').classList.remove('ui-visible');
                }, 4000);
            }
        }

        context.addCustomMessageListener(CUSTOM_CHANNEL, function(customEvent) {
            const data = customEvent.data;
            activeSenderId = customEvent.senderId; 

            if (data.type === "UPDATE_GRID_WINDOW") {
                document.getElementById('cast-video').style.display = 'none';
                document.getElementById('version-display').style.display = 'none';
                bgImageElement.style.opacity = "0"; 
                
                const gridUi = document.getElementById('smart-tv-ui');
                gridUi.style.display = 'grid'; 
                gridUi.style.transform = `translateY(-${data.offset_y}px)`;
                
                if (previewTimer) clearTimeout(previewTimer);
                
                let currentTiles = gridUi.children;
                
                for(let i=0; i<data.items.length; i++) {
                    let item = data.items[i];
                    let tile = currentTiles[i];
                    
                    if (!tile) {
                        tile = document.createElement('div');
                        tile.className = 'grid-tile';
                        tile.innerHTML = `<div class="media-container"></div><div class="title-container"><span></span></div>`;
                        gridUi.appendChild(tile);
                    }
                    
                    let isFocused = (i === data.focus_index);
                    tile.className = 'grid-tile' + (isFocused ? ' focused' : '');
                    tile.classList.remove('is-playing'); 
                    
                    let mediaContainer = tile.querySelector('.media-container');
                    
                    // FIX: Bei JEDEM Update (z.B. durch Scrollen) ALLE Videos ausnahmslos zerstören!
                    // So kann kein altes Video in der Kachel hängen bleiben.
                    let existingVideos = mediaContainer.querySelectorAll('video.video-layer');
                    existingVideos.forEach(v => {
                        v.pause();
                        v.removeAttribute('src'); 
                        v.load();
                        v.remove();
                    });

                    let imageSrc = item.image && item.image !== "" ? item.image : item.video_preview;
                    
                    let imgLayer = mediaContainer.querySelector('img.media-layer');
                    if (!imgLayer) {
                        imgLayer = document.createElement('img');
                        imgLayer.className = 'media-layer';
                        mediaContainer.appendChild(imgLayer);
                    }
                    if (imgLayer.src !== imageSrc) {
                        imgLayer.src = imageSrc;
                    }
                    
                    if (isFocused && item.video_preview && item.video_preview !== "") {
                        previewTimer = setTimeout(() => {
                            try {
                                let v = document.createElement('video');
                                v.className = 'video-layer';
                                v.src = item.video_preview;
                                v.loop = true;
                                v.muted = true;
                                v.playsInline = true;
                                v.style.visibility = "hidden"; // Verhindert Flackern
                                
                                v.onerror = function() {
                                    sendTelemetry("Vorschau-Player abgestürzt bei: " + item.video_preview);
                                };
                                
                                v.onplaying = function() {
                                    v.style.visibility = "visible"; // Harter Schnitt ist sicher für TVs
                                    tile.classList.add('is-playing'); // Erst jetzt rollt der Text!
                                };
                                
                                mediaContainer.appendChild(v);
                                
                                let playPromise = v.play();
                                if (playPromise !== undefined) {
                                    playPromise.catch(e => { sendTelemetry("Autoplay blockiert: " + e.message); });
                                }
                            } catch(err) {
                                sendTelemetry("Exception beim Bauen des Vorschau-Videos.");
                            }
                        }, 700); 
                    } else if (isFocused) {
                        // Wenn es kein Video gibt, soll der Text trotzdem nach 700ms rollen
                        previewTimer = setTimeout(() => {
                            tile.classList.add('is-playing');
                        }, 700);
                    }
                    
                    let titleSpan = tile.querySelector('.title-container span');
                    if(titleSpan.innerText !== item.title) {
                        titleSpan.innerText = item.title;
                    }
                }
                
                while(gridUi.children.length > data.items.length) {
                    gridUi.removeChild(gridUi.lastChild);
                }
            }
            
            else if (data.type === "GET_VERSION") {
                context.sendCustomMessage(CUSTOM_CHANNEL, activeSenderId, { type: "VERSION", version: PLAYER_VERSION });
            }
            else if (data.type === "NOTIFY") {
                showNotification(data.text, data.config);
            }
            else if (data.type === "CONTROL") {
                if (data.action === "PLAY") playerManager.play();
                else if (data.action === "PAUSE") playerManager.pause();
                else if (data.action === "SEEK") playerManager.seek(playerManager.getCurrentTimeSec() + data.value);
                else if (data.action === "SHOW_PROGRESS") showCustomUI(false);
            }
            else if (data.type === "STOP_APP") {
                context.stop(); 
            }
            else if (data.type === "LOAD_VIDEO") {
                document.getElementById('smart-tv-ui').style.display = 'none';
                document.getElementById('cast-video').style.display = 'block';
                document.getElementById('version-display').style.display = 'none';
                
                if (previewTimer) clearTimeout(previewTimer);
                
                if (data.title) document.getElementById('title-ui').innerText = data.title;
                if (data.bg_image) bgImageElement.src = data.bg_image;
                
                let request = new cast.framework.messages.LoadRequestData();
                let mediaInfo = new cast.framework.messages.MediaInformation();
                mediaInfo.contentId = data.url;
                mediaInfo.contentType = data.url.includes('.m3u8') ? 'application/x-mpegurl' : 'video/mp4';
                let metadata = new cast.framework.messages.GenericMediaMetadata();
                metadata.title = data.title || "Custom Stream";
                mediaInfo.metadata = metadata;
                request.media = mediaInfo;
                request.autoplay = true;
                
                if (data.start_time) {
                    request.currentTime = data.start_time;
                }

                playerManager.load(request);

                if (timeUpdateInterval) clearInterval(timeUpdateInterval);
                timeUpdateInterval = setInterval(() => {
                    try {
                        let currentState = playerManager.getPlayerState();
                        
                        if (currentState === 'IDLE' || (currentState === 'BUFFERING' && document.getElementById('status-icon').innerHTML !== SVG_ERROR)) {
                            bgImageElement.style.opacity = "1.0";
                        } else if (currentState === 'PLAYING' || currentState === 'PAUSED') {
                            bgImageElement.style.opacity = "0.15";
                        }

                        if (currentState !== lastPlayerState) {
                            if (document.getElementById('status-icon').innerHTML !== SVG_ERROR) {
                                if (currentState === 'PAUSED') { document.getElementById('status-icon').innerHTML = SVG_PAUSE; showCustomUI(false); }
                                else if (currentState === 'BUFFERING') { document.getElementById('status-icon').innerHTML = SVG_BUFFER; showCustomUI(true); }
                                else if (currentState === 'PLAYING') { document.getElementById('status-icon').innerHTML = SVG_PLAY; showCustomUI(false); }
                            }
                            lastPlayerState = currentState;
                        }

                        let cur = playerManager.getCurrentTimeSec();
                        let dur = playerManager.getDurationSec();
                        
                        document.getElementById('progress-text').innerText = formatTime(cur) + " / " + formatTime(dur);
                        let percent = (dur > 0) ? (cur / dur * 100) : 0;
                        document.getElementById('progress-bar-fill').style.width = percent + '%';
                        updateClock(); 
                        
                        context.sendCustomMessage(CUSTOM_CHANNEL, activeSenderId, {
                            type: "TIME_UPDATE", currentTime: cur, duration: dur
                        });
                    } catch (e) {}
                }, 1000); 
            }
        });

        window.addEventListener('keydown', function(event) {
            if (event.key === "BrowserBack" || event.key === "Escape" || event.key === "Back") {
                event.preventDefault(); event.stopPropagation(); 
            }
            if (activeSenderId) {
                try { context.sendCustomMessage(CUSTOM_CHANNEL, activeSenderId, { type: "KEY_PRESS", key: event.key, code: event.code }); } catch (e) {}
            }
        });

        context.start(options);
    </script>
</body>
</html>
