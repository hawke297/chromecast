<!DOCTYPE html>
<html>
<head>
    <title>One Piece Player</title>
    <!-- Das Google Cast Receiver SDK laden -->
    <script type="text/javascript" src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <style>
        body { 
            background-color: #1e1e2e; 
            margin: 0; 
            overflow: hidden; 
        }
        
        cast-media-player {
            --theme-font-family: 'Helvetica', sans-serif;
            --progress-color: #7bce78; 
            --background-color: #1e1e2e;
            --splash-image: url('https://upload.wikimedia.org/wikipedia/de/thumb/b/bb/One_Piece_Logo.svg/1200px-One_Piece_Logo.svg.png');
        }

        /* NEU: Die Versionsnummer oben links */
        #version-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.5); /* Leicht transparentes Weiß */
            font-family: 'Helvetica', sans-serif;
            font-size: 16px;
            font-weight: bold;
            z-index: 1000;
        }

        /* Unser Test-Kasten oben rechts */
        #custom-overlay {
            position: absolute;
            top: 50px;
            right: 50px;
            background-color: red;
            padding: 15px;
            color: white;
            font-size: 24px;
            display: block;
            z-index: 1000;
        }
    </style>
</head>
<body>
    
    <cast-media-player></cast-media-player>
    
    <!-- NEU: Eindeutige Versionskennung auf dem TV -->
    <div id="version-overlay">Version 1.1 (Mit Funkkanal)</div>
    
    <div id="custom-overlay">Beispiel Overlay</div>

    <script>
        const context = cast.framework.CastReceiverContext.getInstance();
        const playerManager = context.getPlayerManager();
        const CUSTOM_CHANNEL = 'urn:x-cast:op.viewer';

        // ---> NEU: Den Kanal offiziell beim Chromecast anmelden! <---
        const options = new cast.framework.CastReceiverOptions();
        options.customNamespaces = {}; // <-- HIER: Das ist die sichere, absturzfreie Schreibweise
        options.customNamespaces[CUSTOM_CHANNEL] = cast.framework.system.MessageType.JSON;

        // Unser Zuhörer
        context.addCustomMessageListener(CUSTOM_CHANNEL, function(customEvent) {
            if (customEvent.data && customEvent.data.type === "LOAD_VIDEO") {
                let request = new cast.framework.messages.LoadRequestData();
                let mediaInfo = new cast.framework.messages.MediaInformation();
                
                mediaInfo.contentId = customEvent.data.url;
                mediaInfo.contentType = customEvent.data.url.indexOf('.m3u8') !== -1 ? 'application/x-mpegurl' : 'video/mp4';
                
                request.media = mediaInfo;
                request.currentTime = customEvent.data.startTime || 0;
                request.autoplay = true; // Video sofort starten
                
                // Wir zwingen den Player, das Video zu laden
                playerManager.load(request);
            }
        });

        // Die Optionen beim Start übergeben
        context.start(options);
    </script>
</body>
</html>
