<!DOCTYPE html>
<html>
<head>
    <title>One Piece Player</title>
    <script type="text/javascript" src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <style>
        body { 
            background-color: blue; 
            margin: 0; 
            overflow: hidden; 
            font-family: Arial, sans-serif; 
            color: white; 
        }
        
        /* Wir zwingen den Text VOR den Player */
        h1 { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            z-index: 9999; 
            text-shadow: 2px 2px 4px #000000;
        }

        /* Der Player bleibt im Hintergrund */
        cast-media-player {
            z-index: 1;
        }
    </style>
</head>
<body>
    
    <h1>Version 1.4 - Der Schwebe-Test!</h1>
    
    <cast-media-player></cast-media-player>

    <script>
        const context = cast.framework.CastReceiverContext.getInstance();
        context.start();
    </script>
</body>
</html>
